<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="Quarterdeck social preview">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="115%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="rgba(0,0,0,0.09)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="#f5f5f5"/>

  <!-- Left: session grid cards -->
  <!-- Card 1: THINKING -->
  <rect x="60" y="140" width="280" height="160" rx="12" fill="white" stroke="#22c55e" stroke-width="2.5" filter="url(#card-shadow)"/>
  <circle cx="84" cy="174" r="7" fill="#22c55e"/>
  <text x="97" y="179" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13" fill="#16a34a" font-weight="700" letter-spacing="0.5">THINKING</text>
  <text x="74" y="215" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="26" fill="#111827" font-weight="800">Quarterdeck</text>
  <text x="74" y="240" font-family="Monaco,Consolas,monospace" font-size="12" fill="#9ca3af">~/.../PERSONAL/osa-kiro</text>
  <text x="74" y="262" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#0d9488" font-style="italic">Fixed session summary generation…</text>
  <text x="74" y="283" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#d1d5db">by resolving timeout issue</text>

  <!-- Card 2: IDLE -->
  <rect x="60" y="318" width="280" height="140" rx="12" fill="white" stroke="#e5e7eb" stroke-width="1.5" filter="url(#card-shadow)"/>
  <circle cx="84" cy="350" r="7" fill="none" stroke="#9ca3af" stroke-width="2"/>
  <text x="97" y="355" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13" fill="#9ca3af" font-weight="700" letter-spacing="0.5">IDLE</text>
  <text x="74" y="392" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="26" fill="#6b7280" font-weight="800">INT</text>
  <text x="74" y="415" font-family="Monaco,Consolas,monospace" font-size="12" fill="#d1d5db">~/.../PORSCHE/ACTUAL/Di...</text>
  <text x="74" y="438" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#0d9488" font-style="italic">Diagnosed stuck CDK stack…</text>

  <!-- Center: wordmark block -->
  <text x="640" y="230" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="76" font-weight="800" fill="#111827" text-anchor="middle" letter-spacing="-2">Quarterdeck</text>
  <rect x="460" y="248" width="360" height="4" rx="2" fill="#22c55e"/>
  <text x="640" y="298" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="24" fill="#6b7280" text-anchor="middle">Agent control surface for Kiro CLI</text>
  <text x="640" y="338" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="17" fill="#9ca3af" text-anchor="middle">Session status at a glance · Approval gates · Answer from your phone</text>

  <!-- Three feature pills -->
  <rect x="430" y="368" width="130" height="32" rx="16" fill="white" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="495" y="388" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13" fill="#374151" text-anchor="middle">macOS native</text>

  <rect x="574" y="368" width="130" height="32" rx="16" fill="white" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="639" y="388" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13" fill="#374151" text-anchor="middle">Tailscale-ready</text>

  <rect x="718" y="368" width="130" height="32" rx="16" fill="white" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="783" y="388" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13" fill="#374151" text-anchor="middle">MIT license</text>

  <!-- Right: detail panel preview -->
  <rect x="940" y="120" width="300" height="400" rx="12" fill="white" stroke="#e5e7eb" stroke-width="1.5" filter="url(#card-shadow)"/>
  <!-- Panel header -->
  <rect x="940" y="120" width="300" height="50" rx="12" fill="#fafafa"/>
  <rect x="940" y="146" width="300" height="24" fill="#fafafa"/>
  <circle cx="962" cy="145" r="6" fill="#22c55e"/>
  <text x="974" y="149" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13" fill="#16a34a" font-weight="600">Thinking</text>
  <text x="1050" y="149" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13" fill="#111827" font-weight="600">Quarterdeck</text>
  <rect x="940" y="170" width="300" height="1" fill="#e5e7eb"/>

  <!-- Session tabs -->
  <rect x="952" y="180" width="84" height="22" rx="11" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="994" y="195" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="600">Quarterdeck</text>
  <text x="1046" y="195" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" fill="#9ca3af">INT</text>
  <rect x="940" y="208" width="300" height="1" fill="#f0f0f0"/>

  <!-- Pane content -->
  <rect x="952" y="218" width="276" height="170" rx="6" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="964" y="240" font-family="Monaco,Consolas,monospace" font-size="10" fill="#6b7280">|-- o Fix the failing tests</text>
  <text x="964" y="257" font-family="Monaco,Consolas,monospace" font-size="10" fill="#6b7280">|-- o Wire wall board toggle</text>
  <text x="964" y="274" font-family="Monaco,Consolas,monospace" font-size="10" fill="#6b7280">L-- o Build, install, commit</text>
  <text x="964" y="291" font-family="Monaco,Consolas,monospace" font-size="10" fill="#9ca3af">ctrl+x collapse</text>
  <rect x="964" y="300" width="252" height="1" fill="#e5e7eb"/>
  <text x="964" y="318" font-family="Monaco,Consolas,monospace" font-size="10" fill="#374151">cmux · claude-sonnet-4.6 · 19%</text>
  <text x="964" y="335" font-family="Monaco,Consolas,monospace" font-size="10" fill="#9ca3af">Kiro is working · Type to steer</text>
  <text x="964" y="374" font-family="Monaco,Consolas,monospace" font-size="10" fill="#9ca3af">Kiro is working · Ctrl+S to queue</text>

  <!-- Screenshot chip -->
  <rect x="952" y="398" width="148" height="22" rx="5" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="962" y="413" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#6b7280">Screenshot 2026-08-13...</text>

  <!-- Composer -->
  <rect x="952" y="428" width="218" height="46" rx="6" fill="white" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="962" y="450" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="#d1d5db">Reply to this session...</text>
  <rect x="1176" y="428" width="52" height="22" rx="5" fill="#111827"/>
  <text x="1202" y="443" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="600">Send</text>

  <!-- Footer path -->
  <text x="952" y="510" font-family="Monaco,Consolas,monospace" font-size="10" fill="#22c55e">~/.../PERSONAL/osa-kiro</text>
</svg>
